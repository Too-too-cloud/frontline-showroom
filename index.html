<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontline Furnishers | Digital Showroom</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; margin: 0; color: #333; }
        header { background: #222; color: #fff; padding: 2rem; text-align: center; }
        .container { width: 80%; margin: auto; overflow: hidden; padding: 2rem 0; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .card { border: 1px solid #ddd; padding: 10px; text-align: center; }
        .card img { max-width: 100%; height: auto; }
        footer { background: #f4f4f4; text-align: center; padding: 2rem; margin-top: 2rem; }
        .btn { background: #444; color: white; padding: 10px 20px; text-decoration: none; display: inline-block; margin-top: 10px; }
    </style>
</head>
<body>
    <header>
        <h1>Frontline Furnishers</h1>
        <p>Premium Quality. Professional Service.</p>
    </header>

    <div class="container">
        <div class="gallery">
            <div class="card">
                <img src="https://via.placeholder.com/300x200" alt="Furniture Piece">
                <h3>Executive Desk</h3>
                <p>Solid oak, handcrafted finish.</p>
                <a href="mailto:pelingscompany@org.com" class="btn">Inquire Now</a>
            </div>
            </div>
    </div>

    <footer>
        <p>Contact us: <strong>pelingscompany@org.com</strong></p>
        <p>&copy; 2026 Frontline Furnishers</p>
    </footer>
</body>
</html>
